<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluebirds Anim</title>
    <link rel="icon" type="image/png" href="https://www.piapandora.com/tickletrio/misc/icons8-feather-55.png">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #080c14; }
        canvas { display: block; width: 100vw; height: 100vh; }
        body.hide-cursor, body.hide-cursor canvas { cursor: none; }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // --- CONFIGURATION ---
    const NUM_OBJECTS = 3;            // Total active objects on screen
    const ANIMATION_FRAMES = 2;       // Total PNG frame images (obj01.png through obj02.png)
    const ANIMATION_FPS = 6;          // Target animation speed (frames per second)

    // Preload both background images
    const bgNormal = new Image();
    bgNormal.src = 'bg.png';

    const bgAI = new Image();
    bgAI.src = 'aibg.png';

    // Active background reference (defaults to bg.png)
    let currentBg = bgNormal;

    // --- SPACEBAR TOGGLE LOGIC ---
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.key === ' ') {
            e.preventDefault(); // Prevent page scrolling on spacebar
            currentBg = (currentBg === bgNormal) ? bgAI : bgNormal;
        }
    });

    // Load Object Frame Sequence (obj01.png to obj02.png)
    const objFrames = [];
    for (let i = 1; i <= ANIMATION_FRAMES; i++) {
        const img = new Image();
        const num = i.toString().padStart(2, '0');
        img.src = `obj${num}.png`;
        objFrames.push(img);
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- CURSOR AUTO-HIDE LOGIC ---
    let cursorTimeout;
    function resetCursorTimer() {
        document.body.classList.remove('hide-cursor');
        clearTimeout(cursorTimeout);
        cursorTimeout = setTimeout(() => {
            document.body.classList.add('hide-cursor');
        }, 2000);
    }

    window.addEventListener('mousemove', resetCursorTimer);
    resetCursorTimer(); // Start timer on initial load

    // --- FULLSCREEN TOGGLE LOGIC ---
    window.addEventListener('dblclick', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.error(`Error attempting to enable fullscreen: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    });

    // Create single object instance with animation tracking
    function createObject() {
        const size = Math.floor(Math.random() * 50) + 100;
        return {
            x: Math.random() * (canvas.width - size),
            y: Math.random() * (canvas.height - size),
            w: size,
            h: size,
            baseSpeed: 1 + Math.random() * 2,
            vx: 0,
            vy: 0,
            changeDirTimer: 0,
            // Animation tracking
            currentFrame: Math.floor(Math.random() * ANIMATION_FRAMES), // Offset starting frames so they don't sync
            lastFrameTime: performance.now()
        };
    }

    const objects = Array.from({ length: NUM_OBJECTS }, createObject);

    function update(now) {
        const frameInterval = 1000 / ANIMATION_FPS; // Milliseconds per animation frame

        objects.forEach(obj => {
            // --- Animation Cycle ---
            if (now - obj.lastFrameTime >= frameInterval) {
                obj.currentFrame = (obj.currentFrame + 1) % ANIMATION_FRAMES;
                obj.lastFrameTime = now;
            }

            // --- Movement Logic ---
            if (obj.changeDirTimer <= 0) {
                const angle = Math.random() * Math.PI * 2;
                const currentSpeed = obj.baseSpeed * (0.8 + Math.random() * 0.6);
                obj.vx = Math.cos(angle) * currentSpeed;
                obj.vy = Math.sin(angle) * currentSpeed;
                obj.changeDirTimer = Math.floor(Math.random() * 60) + 30;
            }
            obj.changeDirTimer--;

            obj.x += obj.vx;
            obj.y += obj.vy;

            // Wall bounce & reset direction timer
            if (obj.x < 0) {
                obj.x = 0;
                obj.vx = Math.abs(obj.vx);
                obj.changeDirTimer = Math.floor(Math.random() * 60) + 30;
            } else if (obj.x > canvas.width - obj.w) {
                obj.x = canvas.width - obj.w;
                obj.vx = -Math.abs(obj.vx);
                obj.changeDirTimer = Math.floor(Math.random() * 60) + 30;
            }

            if (obj.y < 0) {
                obj.y = 0;
                obj.vy = Math.abs(obj.vy);
                obj.changeDirTimer = Math.floor(Math.random() * 60) + 30;
            } else if (obj.y > canvas.height - obj.h) {
                obj.y = canvas.height - obj.h;
                obj.vy = -Math.abs(obj.vy);
                obj.changeDirTimer = Math.floor(Math.random() * 60) + 30;
            }
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw background PNG scaled to cover & centered
        if (currentBg.complete && currentBg.naturalWidth !== 0) {
            const scale = Math.max(canvas.width / currentBg.naturalWidth, canvas.height / currentBg.naturalHeight);
            const drawWidth = currentBg.naturalWidth * scale;
            const drawHeight = currentBg.naturalHeight * scale;
            const offsetX = (canvas.width - drawWidth) / 2;
            const offsetY = (canvas.height - drawHeight) / 2;

            ctx.drawImage(currentBg, offsetX, offsetY, drawWidth, drawHeight);
        } else {
            ctx.fillStyle = '#080c14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Draw active animation frame (Sorted by width so smaller birds draw behind larger ones)
        [...objects].sort((a, b) => a.w - b.w).forEach(obj => {
            const activeImg = objFrames[obj.currentFrame];

            ctx.save(); // Save context state before applying transforms

            if (obj.vx > 0) {
                // Moving Right: Flip horizontally
                ctx.scale(-1, 1);
                if (activeImg && activeImg.complete && activeImg.naturalWidth !== 0) {
                    ctx.drawImage(activeImg, -obj.x - obj.w, obj.y, obj.w, obj.h);
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(-obj.x - obj.w, obj.y, obj.w, obj.h);
                }
            } else {
                // Moving Left: Draw normally
                if (activeImg && activeImg.complete && activeImg.naturalWidth !== 0) {
                    ctx.drawImage(activeImg, obj.x, obj.y, obj.w, obj.h);
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                }
            }

            ctx.restore(); // Restore context state
        });
    }

    function loop(timestamp) {
        update(timestamp);
        draw();
        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
</script>
</body>
</html>
