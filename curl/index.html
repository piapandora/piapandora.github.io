<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cURL to Windows Terminal Converter</title>
	<link rel="icon" type="image/png" href="https://www.piapandora.com/tickletrio/misc/icons8-feather-55.png">
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        cardBg: '#1e2227',
                        cardBorder: '#2d333b',
                        accentBlue: '#3b82f6',
                        accentBlueHover: '#2563eb',
                        outputBg: '#0d1117'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-[#f0f6fc] min-h-screen flex items-center justify-center p-4 sm:p-6 font-sans">

    <div class="w-full max-w-2xl bg-cardBg border border-cardBorder rounded-2xl shadow-2xl p-6 sm:p-8">
        
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-white mb-2 flex items-center gap-2">
                <svg class="w-7 h-7 text-accentBlue" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                cURL to Windows Terminal Converter
            </h1>
            <p class="text-sm text-[#8b949e]">Paste your Bash/Linux cURL script below to format it cleanly for Windows PowerShell.</p>
        </div>

        <!-- Input Section -->
        <div class="mb-5">
            <label for="inputCurl" class="block text-sm font-medium text-[#c9d1d9] mb-2">Input cURL Script:</label>
            <textarea id="inputCurl" rows="6" 
                class="w-full bg-[#0d1117] border border-cardBorder rounded-xl p-3.5 text-sm font-mono text-[#f0f6fc] focus:outline-none focus:ring-2 focus:ring-accentBlue focus:border-transparent transition resize-y placeholder-[#484f58]"
                placeholder="curl -X POST 'https://api.example.com/v1/resource' \
  -H 'Authorization: Bearer YOUR_TOKEN' \
  -H 'Content-Type: application/json' \
  -d '{\"name\": \"test\"}'"></textarea>
        </div>

        <!-- Action Button -->
        <button onclick="convertCurl()" 
            class="w-full bg-accentBlue hover:bg-accentBlueHover text-white font-medium py-3 px-4 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 text-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
            Convert for Windows
        </button>

        <!-- Output Section -->
        <div class="mt-6 pt-6 border-t border-cardBorder">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold uppercase tracking-wider text-[#8b949e]">PowerShell / Windows Terminal Format</span>
                <button id="copyBtn" onclick="copyToClipboard()" 
                    class="bg-[#30363d] hover:bg-[#3b434b] text-[#c9d1d9] text-xs font-medium py-1.5 px-3 rounded-lg border border-[#484f58] transition flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round5" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    <span id="copyText">Copy</span>
                </button>
            </div>
            <div class="bg-outputBg border border-cardBorder rounded-xl p-4 overflow-x-auto">
                <pre id="psOutput" class="font-mono text-xs sm:text-sm text-[#7ee787] whitespace-pre-wrap break-all">Converted command will appear here...</pre>
            </div>
        </div>

    </div>

    <script>
        function convertCurl() {
            let input = document.getElementById('inputCurl').value.trim();
            const outputEl = document.getElementById('psOutput');
            
            if (!input) {
                outputEl.innerText = "Please enter a valid cURL script above.";
                outputEl.className = "font-mono text-xs sm:text-sm text-[#f85149] whitespace-pre-wrap break-all";
                return;
            }

            // 1. Remove line continuation backslashes and normalize whitespace into a single line
            let cleaned = input.replace(/\\\s*\r?\n/g, ' ').replace(/\s+/g, ' ');

            // 2. Replace 'curl' with 'curl.exe' to prevent PowerShell alias conflicts with Invoke-WebRequest
            cleaned = cleaned.replace(/^curl\b/i, 'curl.exe');

            // 3. Handle quote adjustments for Windows shell safety (convert single quotes to double quotes where applicable)
            let psCmd = cleaned.replace(/'/g, '"');

            outputEl.innerText = psCmd;
            outputEl.className = "font-mono text-xs sm:text-sm text-[#7ee787] whitespace-pre-wrap break-all";
        }

        function copyToClipboard() {
            const text = document.getElementById('psOutput').innerText;
            const copyTextSpan = document.getElementById('copyText');
            const copyBtn = document.getElementById('copyBtn');

            if (!text || text.startsWith("Converted command") || text.startsWith("Please enter")) {
                return;
            }

            // Using fallback-safe approach for iFrame limitations if navigator.clipboard is blocked
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showCopiedFeedback(copyTextSpan, copyBtn);
                }).catch(() => {
                    fallbackCopy(text, copyTextSpan, copyBtn);
                });
            } else {
                fallbackCopy(text, copyTextSpan, copyBtn);
            }
        }

        function fallbackCopy(text, copyTextSpan, copyBtn) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';  // Avoid scrolling to bottom
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                showCopiedFeedback(copyTextSpan, copyBtn);
            } catch (err) {
                console.error('Failed to copy text', err);
            }
            document.body.removeChild(textarea);
        }

        function showCopiedFeedback(copyTextSpan, copyBtn) {
            copyTextSpan.innerText = "Copied!";
            copyBtn.classList.add('bg-[#238636]', 'border-[#2ea043]', 'text-white');
            setTimeout(() => {
                copyTextSpan.innerText = "Copy";
                copyBtn.classList.remove('bg-[#238636]', 'border-[#2ea043]', 'text-white');
            }, 2000);
        }
    </script>
</body>
</html>
