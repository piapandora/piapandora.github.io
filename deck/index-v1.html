<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vertical Image Deck</title>
  <link rel="icon" type="image/png" href="https://www.piapandora.com/tickletrio/misc/icons8-feather-55.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #deck-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #slides-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      will-change: transform;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    .img-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #json-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #json-modal.visible {
      display: flex;
    }

    .modal-card {
      background: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      color: #ffffff;
      touch-action: auto;
    }

    .modal-card h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .modal-card p {
      font-size: 0.875rem;
      color: #a1a1a6;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .modal-card input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #38383a;
      background: #2c2c2e;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 16px;
      user-select: text;
      -webkit-user-select: text;
    }

    .modal-card input[type="text"]:focus {
      border-color: #0a84ff;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-btn {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .modal-btn:active {
      opacity: 0.7;
    }

    .modal-btn-cancel {
      background: #2c2c2e;
      color: #ffffff;
    }

    .modal-btn-submit {
      background: #0a84ff;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div id="deck-container">
    <div id="slides-track">
      <div class="slide" id="slide-prev">
        <div class="img-wrapper">
          <img id="img-prev" src="" alt="" />
        </div>
      </div>
      <div class="slide" id="slide-curr">
        <div class="img-wrapper">
          <img id="img-curr" src="" alt="" />
        </div>
      </div>
      <div class="slide" id="slide-next">
        <div class="img-wrapper">
          <img id="img-next" src="" alt="" />
        </div>
      </div>
    </div>
  </div>

  <div id="json-modal">
    <div class="modal-card">
      <h2>Load Image Array</h2>
      <p>Enter URL of a JSON file containing an array of image links.</p>
      <input type="text" id="json-url-input" placeholder="https://example.com/images.json" spellcheck="false" />
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" id="btn-modal-cancel">Cancel</button>
        <button class="modal-btn modal-btn-submit" id="btn-modal-submit">Load</button>
      </div>
    </div>
  </div>

  <script>
    const categories = ['red', 'blonde', 'dark'];
    let IMAGES = categories.flatMap(cat => 
      Array.from({ length: 10 }, (_, i) => {
        const num = String(i + 1).padStart(2, '0');
        return `https://piapandora.com/tickletrio/images/${cat}/${cat}${num}.jpg`;
      })
    );
	
    let currentIndex = 0;
    let windowHeight = window.innerHeight;
    let imageCache = {};

    let startY = 0;
    let currentY = 0;
    let deltaY = 0;
    let isDragging = false;
    let isAnimating = false;

    let lastY = 0;
    let lastTime = 0;
    let velocityY = 0;

    let lastTapTime = 0;

    let tapTimestamps = [];
    const JSON_TAP_COUNT = 13;
    const JSON_WINDOW_MS = 2666;

    const track = document.getElementById('slides-track');
    const slidePrev = document.getElementById('slide-prev');
    const slideCurr = document.getElementById('slide-curr');
    const slideNext = document.getElementById('slide-next');

    const imgPrev = document.getElementById('img-prev');
    const imgCurr = document.getElementById('img-curr');
    const imgNext = document.getElementById('img-next');

    const modal = document.getElementById('json-modal');
    const jsonUrlInput = document.getElementById('json-url-input');
    const btnCancel = document.getElementById('btn-modal-cancel');
    const btnSubmit = document.getElementById('btn-modal-submit');

    function preloadSingleImage(url) {
      if (!imageCache[url]) {
        const img = new Image();
        img.src = url;
        imageCache[url] = img;
      }
    }

    function preloadAdjacentImages() {
      if (!IMAGES.length) return;

      const offsets = [-2, -1, 0, 1, 2];
      offsets.forEach(offset => {
        const idx = getWrappedIndex(currentIndex + offset);
        preloadSingleImage(IMAGES[idx]);
      });

      if ('requestIdleCallback' in window) {
        requestIdleCallback(() => {
          IMAGES.forEach(url => preloadSingleImage(url));
        });
      } else {
        setTimeout(() => {
          IMAGES.forEach(url => preloadSingleImage(url));
        }, 1000);
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function getWrappedIndex(idx) {
      const len = IMAGES.length;
      if (len === 0) return 0;
      return ((idx % len) + len) % len;
    }

    function updateImages() {
      if (!IMAGES.length) return;

      const prevIndex = getWrappedIndex(currentIndex - 1);
      const currIndex = getWrappedIndex(currentIndex);
      const nextIndex = getWrappedIndex(currentIndex + 1);

      imgPrev.src = IMAGES[prevIndex];
      imgCurr.src = IMAGES[currIndex];
      imgNext.src = IMAGES[nextIndex];

      slidePrev.style.transform = `translate3d(0, ${-windowHeight}px, 0)`;
      slideCurr.style.transform = `translate3d(0, 0, 0)`;
      slideNext.style.transform = `translate3d(0, ${windowHeight}px, 0)`;

      preloadAdjacentImages();
    }

    function recordJsonTap() {
      const now = performance.now();
      tapTimestamps.push(now);

      tapTimestamps = tapTimestamps.filter(t => (now - t) <= JSON_WINDOW_MS);

      if (tapTimestamps.length >= JSON_TAP_COUNT) {
        tapTimestamps = [];
        openModal();
      }
    }

    function openModal() {
      modal.classList.add('visible');
      setTimeout(() => jsonUrlInput.focus(), 100);
    }

    function closeModal() {
      modal.classList.remove('visible');
      jsonUrlInput.value = '';
    }

    async function loadJsonUrl() {
      const url = jsonUrlInput.value.trim();
      if (!url) {
        closeModal();
        return;
      }

      btnSubmit.disabled = true;

      try {
        const response = await fetch(url);
        if (response.ok) {
          const data = await response.json();
          if (Array.isArray(data) && data.length > 0) {
            IMAGES = data;
            imageCache = {};
            currentIndex = 0;
            updateImages();
          }
        }
      } catch (err) {
      } finally {
        btnSubmit.disabled = false;
        closeModal();
      }
    }

    function onTouchStart(e) {
      if (modal.classList.contains('visible')) return;

      recordJsonTap();

      if (isAnimating) return;

      const currentTime = performance.now();
      const tapLength = currentTime - lastTapTime;

      if (tapLength < 300 && tapLength > 0) {
        toggleFullscreen();
        lastTapTime = 0;
      } else {
        lastTapTime = currentTime;
      }

      isDragging = true;
      const touch = e.touches ? e.touches[0] : e;
      startY = touch.clientY;
      currentY = startY;
      lastY = startY;
      lastTime = performance.now();
      velocityY = 0;

      track.style.transition = 'none';
    }

    function onTouchMove(e) {
      if (!isDragging) return;

      const touch = e.touches ? e.touches[0] : e;
      currentY = touch.clientY;
      deltaY = currentY - startY;

      if (Math.abs(deltaY) > 10) {
        lastTapTime = 0;
      }

      const now = performance.now();
      const dt = now - lastTime;
      if (dt > 0) {
        const dy = currentY - lastY;
        velocityY = (dy / dt) * 1000;
        lastY = currentY;
        lastTime = now;
      }

      track.style.transform = `translate3d(0, ${deltaY}px, 0)`;
    }

    function onTouchEnd() {
      if (!isDragging) return;
      isDragging = false;

      const swipeDistanceThreshold = windowHeight * 0.22;
      const velocityThreshold = 450;

      let targetIndexDelta = 0;

      if (deltaY < -swipeDistanceThreshold || velocityY < -velocityThreshold) {
        targetIndexDelta = 1;
      } else if (deltaY > swipeDistanceThreshold || velocityY > velocityThreshold) {
        targetIndexDelta = -1;
      }

      snapToSlide(targetIndexDelta);
    }

    function snapToSlide(indexDelta) {
      isAnimating = true;

      const targetY = -indexDelta * windowHeight;
      const duration = 0.38;

      track.style.transition = `transform ${duration}s cubic-bezier(0.25, 1, 0.5, 1)`;
      track.style.transform = `translate3d(0, ${targetY}px, 0)`;

      setTimeout(() => {
        currentIndex = getWrappedIndex(currentIndex + indexDelta);
        track.style.transition = 'none';
        track.style.transform = `translate3d(0, 0, 0)`;
        updateImages();
        isAnimating = false;
        deltaY = 0;
      }, duration * 1000);
    }

    let wheelTimeout = null;
    let accumulatedWheel = 0;

    function onWheel(e) {
      if (modal.classList.contains('visible')) return;
      e.preventDefault();
      if (isAnimating) return;

      accumulatedWheel += e.deltaY;

      clearTimeout(wheelTimeout);
      wheelTimeout = setTimeout(() => {
        accumulatedWheel = 0;
      }, 200);

      if (Math.abs(accumulatedWheel) > 50) {
        const delta = accumulatedWheel > 0 ? 1 : -1;
        accumulatedWheel = 0;
        snapToSlide(delta);
      }
    }

    function onResize() {
      windowHeight = window.innerHeight;
      updateImages();
    }

    btnCancel.addEventListener('click', closeModal);
    btnSubmit.addEventListener('click', loadJsonUrl);
    jsonUrlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadJsonUrl();
      if (e.key === 'Escape') closeModal();
    });

    window.addEventListener('resize', onResize);
    window.addEventListener('wheel', onWheel, { passive: false });

    const container = document.getElementById('deck-container');
    container.addEventListener('touchstart', onTouchStart, { passive: true });
    container.addEventListener('touchmove', onTouchMove, { passive: true });
    container.addEventListener('touchend', onTouchEnd);

    container.addEventListener('mousedown', onTouchStart);
    container.addEventListener('dblclick', toggleFullscreen);
    window.addEventListener('mousemove', onTouchMove);
    window.addEventListener('mouseup', onTouchEnd);

    window.onload = function() {
      updateImages();
      preloadAdjacentImages();
    };
  </script>
  <!-- If you want this app to run with a different array of images by default, just add an "images.js" file to the root directory that assigns a new "IMAGES" array. -->
  <script src="images.js"></script>
</body>
</html>
