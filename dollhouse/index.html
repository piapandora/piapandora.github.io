<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pia's Dollhouse</title>
  <link rel="icon" type="image/png" href="https://www.piapandora.com/tickletrio/misc/icons8-feather-55.png">
  <style>
    * { box-sizing: border-box; }

    body {
      background-color: #0f172a;
      color: #fff;
      /* Same font stack Bootstrap uses: the system's own UI font, no downloads */
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
                   "Noto Sans", "Liberation Sans", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 12px 24px;
      user-select: none;
    }

    h1 {
      margin: 0 0 48px;
      /* Scales with the window like Bootstrap's display-5, maxing out at 48px */
      font-size: clamp(32px, calc(1.425rem + 2.1vw), 48px);
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
    }

    .grid {
      width: 100%;
      max-width: 896px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .tile {
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      display: block;
      background-color: #252738;
      border: 1px solid #3d405b;
    }

    a.tile {
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }

    a.tile:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: #41a6f6;
      box-shadow: 0 12px 32px rgba(65,166,246,0.25);
    }

    a.tile:active {
      transform: scale(0.97);
    }

    .tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .tile.empty {
      background-color: transparent;
      border: 2px dashed #252738;
    }

    footer {
      margin-top: auto;
      padding-top: 48px;
      font-size: 14px;
      color: #64748b;
    }

    footer a {
      color: #94a3b8;
      text-decoration: none;
    }

    footer a:hover {
      color: #fff;
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    }
  </style>
</head>
<body>

  <h1>Pia's Dollhouse</h1>

  <div class="grid" id="grid"></div>

  <footer>
    <a href="https://piapandora.com">Pia Pandora</a> © 2026
  </footer>

  <script>
    const RELEASED = 3;
	const SLOTS = Math.ceil(RELEASED / 4) * 4;
    const grid = document.getElementById('grid');

    for (let i = 1; i <= SLOTS; i++) {
      const id = String(i).padStart(2, '0');

      if (i <= RELEASED) {
        const link = document.createElement('a');
        link.className = 'tile';
        link.href = `${id}/`;
        link.setAttribute('aria-label', `Dollhouse ${id}`);

        const img = document.createElement('img');
        img.src = `thumbs/${id}.jpg`;
        img.alt = `Dollhouse ${id}`;
        img.loading = 'lazy';

        link.appendChild(img);
        grid.appendChild(link);
      } else {
        const empty = document.createElement('div');
        empty.className = 'tile empty';
        grid.appendChild(empty);
      }
    }
  </script>
</body>
</html>
