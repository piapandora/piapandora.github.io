<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image URL Extractor</title>
	<link rel="icon" type="image/png" href="https://www.piapandora.com/tickletrio/misc/icons8-feather-55.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
                    },
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(75, 85, 99, 0.5);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 114, 128, 0.7);
        }
    </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-800 dark:text-zinc-200 font-sans min-h-full flex flex-col transition-colors duration-200">

    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <header class="border-b border-zinc-200 dark:border-zinc-800/80 bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 flex items-center justify-center font-bold text-xs shadow-xs tracking-wider">
                    IMG
                </div>
                <div>
                    <h1 class="text-sm font-semibold tracking-tight text-zinc-900 dark:text-zinc-100">URL Extractor</h1>
                    <p class="text-[11px] text-zinc-500 dark:text-zinc-400 -mt-0.5">Parse Source Code & Convert Image Links to JSON</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button id="clear-btn" class="px-3 py-1.5 text-xs font-medium text-zinc-600 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800/60 rounded-md transition-all">
                    Clear Text
                </button>
                <div class="h-4 w-[1px] bg-zinc-200 dark:bg-zinc-800 my-auto"></div>
                <button id="theme-toggle" class="p-1.5 text-zinc-500 hover:text-zinc-800 dark:text-zinc-400 dark:hover:text-zinc-200 rounded-md hover:bg-zinc-100 dark:hover:bg-zinc-800/60 transition-all" title="Toggle Theme">
                    <svg id="sun-icon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    <svg id="moon-icon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.03 9.03 0 0012 21a9.03 9.03 0 008.354-5.646z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-4">

        <div class="bg-white dark:bg-zinc-900 rounded-xl border border-zinc-200/80 dark:border-zinc-800 p-3 shadow-xs flex flex-wrap items-center justify-between gap-3 text-xs">
            <div class="flex flex-wrap items-center gap-4">
                <span class="font-semibold text-zinc-400 dark:text-zinc-500 uppercase tracking-wider text-[10px]">Filter Options</span>
                <label class="flex items-center gap-2 cursor-pointer text-zinc-800 dark:text-zinc-200 font-medium bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/60 px-2.5 py-1 rounded-md">
                    <input type="checkbox" id="opt-images-only" checked class="rounded border-emerald-400 text-emerald-600 focus:ring-0">
                    <span class="text-emerald-700 dark:text-emerald-300 font-semibold">Images Only</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer text-zinc-700 dark:text-zinc-300">
                    <input type="checkbox" id="opt-unique" checked class="rounded border-zinc-300 dark:border-zinc-700 text-zinc-900 focus:ring-0">
                    <span>Unique Links Only</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer text-zinc-700 dark:text-zinc-300">
                    <input type="checkbox" id="opt-absolute" checked class="rounded border-zinc-300 dark:border-zinc-700 text-zinc-900 focus:ring-0">
                    <span>Absolute Paths</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer text-zinc-700 dark:text-zinc-300">
                    <input type="checkbox" id="opt-relative" checked class="rounded border-zinc-300 dark:border-zinc-700 text-zinc-900 focus:ring-0">
                    <span>Relative Paths</span>
                </label>
            </div>

            <div class="flex items-center gap-3">
                <div class="inline-flex rounded-lg bg-zinc-100 dark:bg-zinc-800 p-0.5 text-xs border border-zinc-200/60 dark:border-zinc-700/60">
                    <button id="fmt-simple" class="px-2.5 py-1 rounded-md font-medium text-zinc-900 dark:text-zinc-100 bg-white dark:bg-zinc-700 shadow-xs transition-all">Simple Array</button>
                    <button id="fmt-detailed" class="px-2.5 py-1 rounded-md font-medium text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-200 transition-all">Detailed Objects</button>
                </div>

                <div id="stats-badge" class="px-2.5 py-1 rounded-full bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 font-mono text-[11px] font-medium border border-zinc-200 dark:border-zinc-700">
                    0 images found
                </div>
            </div>
        </div>

        <div class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-4 min-h-[520px]">
            
            <div class="flex flex-col rounded-xl border border-zinc-200/80 dark:border-zinc-800 bg-white dark:bg-zinc-900 shadow-sm overflow-hidden">
                <div class="px-4 py-2.5 bg-zinc-50/70 dark:bg-zinc-900/60 border-b border-zinc-200/80 dark:border-zinc-800 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <span class="text-xs font-medium text-zinc-700 dark:text-zinc-300">Input Source / HTML Text</span>
                    </div>
                    <button id="sample-btn" class="text-[11px] text-zinc-500 hover:text-zinc-800 dark:text-zinc-400 dark:hover:text-zinc-200 underline underline-offset-2">
                        Load Sample HTML
                    </button>
                </div>
                <div class="relative flex-1">
                    <textarea 
                        id="input-text" 
                        placeholder="Paste website source code (HTML), CSS, or raw text here..." 
                        class="w-full h-full min-h-[350px] p-4 bg-transparent border-0 focus:ring-0 text-sm font-mono text-zinc-800 dark:text-zinc-200 placeholder-zinc-400 dark:placeholder-zinc-600 resize-none outline-none leading-relaxed"
                        spellcheck="false"
                    ></textarea>
                </div>
            </div>

            <div class="flex flex-col rounded-xl border border-zinc-200/80 dark:border-zinc-800 bg-white dark:bg-zinc-900 shadow-sm overflow-hidden">
                <div class="px-4 py-2.5 bg-zinc-50/70 dark:bg-zinc-900/60 border-b border-zinc-200/80 dark:border-zinc-800 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                        </svg>
                        <span class="text-xs font-medium text-zinc-700 dark:text-zinc-300">Extracted JSON Output</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="download-json-btn" class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-200 text-xs font-medium rounded-md transition-all active:scale-95 border border-zinc-200 dark:border-zinc-700">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                            <span>Download</span>
                        </button>
                        <button id="copy-json-btn" class="inline-flex items-center gap-1.5 px-3 py-1 bg-zinc-900 dark:bg-zinc-100 hover:bg-zinc-800 dark:hover:bg-white text-white dark:text-zinc-900 text-xs font-medium rounded-md shadow-xs transition-all active:scale-95">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                            </svg>
                            <span>Copy JSON</span>
                        </button>
                    </div>
                </div>

                <div class="relative flex-1 bg-zinc-900 dark:bg-zinc-950 p-4 overflow-auto">
                    <pre id="json-output" class="font-mono text-xs text-emerald-400 dark:text-emerald-300 leading-relaxed whitespace-pre-wrap break-all">// Extracted JSON links will appear here ...</pre>
                </div>
            </div>

        </div>
    </main>

    <script>
        (function() {
            var outputFormat = 'simple';

            var IMAGE_EXT_REGEX = /\.(png|jpe?g|gif|svg|webp|avif|bmp|ico|tiff?|heic)(?:[?#].*)?$/i;

            function getFileExtension(urlStr) {
                var clean = urlStr.split('?')[0].split('#')[0];
                var parts = clean.split('.');
                if (parts.length > 1) {
                    return parts.pop().toLowerCase();
                }
                return 'unknown';
            }

            document.addEventListener('DOMContentLoaded', function() {
                var themeToggleBtn = document.getElementById('theme-toggle');
                var sunIcon = document.getElementById('sun-icon');
                var moonIcon = document.getElementById('moon-icon');

                function applyTheme(isDark) {
                    if (isDark) {
                        document.documentElement.classList.add('dark');
                        sunIcon.classList.remove('hidden');
                        moonIcon.classList.add('hidden');
                    } else {
                        document.documentElement.classList.remove('dark');
                        sunIcon.classList.add('hidden');
                        moonIcon.classList.remove('hidden');
                    }
                }

                var initialDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(initialDark);

                themeToggleBtn.addEventListener('click', function() {
                    var isDark = document.documentElement.classList.contains('dark');
                    applyTheme(!isDark);
                });

                var inputTextarea = document.getElementById('input-text');
                var jsonOutput = document.getElementById('json-output');
                var copyJsonBtn = document.getElementById('copy-json-btn');
                var downloadJsonBtn = document.getElementById('download-json-btn');
                var clearBtn = document.getElementById('clear-btn');
                var sampleBtn = document.getElementById('sample-btn');
                var statsBadge = document.getElementById('stats-badge');

                var optImagesOnly = document.getElementById('opt-images-only');
                var optUnique = document.getElementById('opt-unique');
                var optAbsolute = document.getElementById('opt-absolute');
                var optRelative = document.getElementById('opt-relative');

                var fmtSimpleBtn = document.getElementById('fmt-simple');
                var fmtDetailedBtn = document.getElementById('fmt-detailed');

                fmtSimpleBtn.addEventListener('click', function() {
                    outputFormat = 'simple';
                    fmtSimpleBtn.className = "px-2.5 py-1 rounded-md font-medium text-zinc-900 dark:text-zinc-100 bg-white dark:bg-zinc-700 shadow-xs transition-all";
                    fmtDetailedBtn.className = "px-2.5 py-1 rounded-md font-medium text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-200 transition-all";
                    updateOutput();
                });

                fmtDetailedBtn.addEventListener('click', function() {
                    outputFormat = 'detailed';
                    fmtDetailedBtn.className = "px-2.5 py-1 rounded-md font-medium text-zinc-900 dark:text-zinc-100 bg-white dark:bg-zinc-700 shadow-xs transition-all";
                    fmtSimpleBtn.className = "px-2.5 py-1 rounded-md font-medium text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-200 transition-all";
                    updateOutput();
                });

                function extractURLs(text) {
                    if (!text || !text.trim()) {
                        return [];
                    }

                    var seen = new Set();
                    var list = [];

                    var attrRegex = /(?:href|src|action|content|data-src|data-url|poster)\s*=\s*["']([^"']+)["']/gi;
                    var match;
                    while ((match = attrRegex.exec(text)) !== null) {
                        processUrl(match[1]);
                    }

                    var urlRegex = /\b(?:https?:\/\/|www\.)[^\s<>"'{}|\\^`\[\]]+/gi;
                    while ((match = urlRegex.exec(text)) !== null) {
                        processUrl(match[0]);
                    }

                    var protoRelativeRegex = /(?:\s|^|["'])\/\/[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(?:\/[^\s<>"'{}|\\^`\[\]]*)?/gi;
                    while ((match = protoRelativeRegex.exec(text)) !== null) {
                        var cleanedProto = match[0].trim().replace(/^["']/, '');
                        processUrl(cleanedProto);
                    }

                    function processUrl(rawUrl) {
                        if (!rawUrl) return;
                        var cleaned = rawUrl.trim().replace(/[.,;:]+$/, '');

                        if (cleaned.indexOf('javascript:') === 0 || 
                            cleaned.indexOf('mailto:') === 0 || 
                            cleaned.indexOf('tel:') === 0 || 
                            cleaned === '#') {
                            return;
                        }

                        if (optImagesOnly.checked && !IMAGE_EXT_REGEX.test(cleaned)) {
                            return;
                        }

                        var isAbsolute = /^(?:https?:)?\/\//i.test(cleaned) || cleaned.indexOf('www.') === 0;
                        var isAbsolutePath = cleaned.indexOf('/') === 0;
                        var isRelative = !isAbsolute && !isAbsolutePath;

                        if (!optAbsolute.checked && (isAbsolute || isAbsolutePath)) return;
                        if (!optRelative.checked && isRelative) return;

                        if (optUnique.checked) {
                            if (seen.has(cleaned)) return;
                            seen.add(cleaned);
                        }

                        if (outputFormat === 'detailed') {
                            list.push({
                                url: cleaned,
                                type: isAbsolute ? 'absolute' : (isAbsolutePath ? 'absolute-path' : 'relative'),
                                extension: getFileExtension(cleaned),
                                isImage: IMAGE_EXT_REGEX.test(cleaned)
                            });
                        } else {
                            list.push(cleaned);
                        }
                    }

                    return list;
                }

                function updateOutput() {
                    var rawText = inputTextarea.value;
                    var results = extractURLs(rawText);

                    var unitLabel = optImagesOnly.checked ? 'image' : 'link';
                    statsBadge.textContent = results.length + ' ' + unitLabel + (results.length === 1 ? '' : 's') + ' found';

                    jsonOutput.textContent = JSON.stringify(results, null, 2);
                }

                inputTextarea.addEventListener('input', updateOutput);
                optImagesOnly.addEventListener('change', updateOutput);
                optUnique.addEventListener('change', updateOutput);
                optAbsolute.addEventListener('change', updateOutput);
                optRelative.addEventListener('change', updateOutput);

                copyJsonBtn.addEventListener('click', function() {
                    var textToCopy = jsonOutput.textContent;
                    var tempArea = document.createElement('textarea');
                    tempArea.value = textToCopy;
                    document.body.appendChild(tempArea);
                    tempArea.select();
                    try {
                        document.execCommand('copy');
                        showToast('Copied JSON to clipboard!');
                    } catch (err) {
                        showToast('Failed to copy text', true);
                    }
                    document.body.removeChild(tempArea);
                });

                downloadJsonBtn.addEventListener('click', function() {
                    var content = jsonOutput.textContent;
                    if (!content || content.startsWith('//')) {
                        showToast('No JSON data to download', true);
                        return;
                    }
                    var blob = new Blob([content], { type: 'application/json' });
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = 'extracted-image-urls.json';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast('Downloaded JSON file!');
                });

                clearBtn.addEventListener('click', function() {
                    inputTextarea.value = '';
                    updateOutput();
                    showToast('Cleared input field');
                });

                sampleBtn.addEventListener('click', function() {
                    var sampleHTML = [
                        '<!DOCTYPE html>',
                        '<html>',
                        '<head>',
                        '    <link rel="icon" href="https://cdn.example.com/assets/favicon.ico">',
                        '    <link rel="stylesheet" href="https://cdn.example.com/styles.css">',
                        '</head>',
                        '<body>',
                        '    <header>',
                        '        <img src="//cdn.example.com/brand/logo.svg" alt="Logo">',
                        '        <a href="https://example.com/about">About Us</a>',
                        '    </header>',
                        '    <main>',
                        '        <img src="/static/images/hero-banner.webp?v=1.2" alt="Hero Banner">',
                        '        <div style="background-image: url(../assets/background.jpg?quality=80);">',
                        '            <img src="../gallery/photo1.jpeg#view" alt="Photo 1">',
                        '            <img src="https://images.unsplash.com/photo-sample.png" alt="Sample PNG">',
                        '        </div>',
                        '        <a href="https://example.com/docs/file.pdf">Download Specs</a>',
                        '    </main>',
                        '</body>',
                        '</html>'
                    ].join('\n');

                    inputTextarea.value = sampleHTML;
                    updateOutput();
                    showToast('Loaded sample HTML code');
                });

                function showToast(message, isError) {
                    var container = document.getElementById('toast-container');
                    var toast = document.createElement('div');
                    toast.className = 'pointer-events-auto px-3.5 py-2 rounded-lg text-xs font-medium shadow-lg transition-all duration-300 transform translate-y-2 opacity-0 flex items-center gap-2 ' +
                        (isError 
                            ? 'bg-rose-900 text-rose-100 border border-rose-800' 
                            : 'bg-zinc-800 text-zinc-100 border border-zinc-700 dark:bg-zinc-100 dark:text-zinc-900 dark:border-zinc-200');

                    var span = document.createElement('span');
                    span.textContent = message;
                    toast.appendChild(span);
                    container.appendChild(toast);

                    requestAnimationFrame(function() {
                        toast.classList.remove('translate-y-2', 'opacity-0');
                    });

                    setTimeout(function() {
                        toast.classList.add('opacity-0', 'translate-y-2');
                        setTimeout(function() {
                            if (toast.parentNode) {
                                toast.parentNode.removeChild(toast);
                            }
                        }, 300);
                    }, 2500);
                }

                updateOutput();
            });
        })();
    </script>
</body>
</html>
