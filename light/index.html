<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Let There Be Light</title>
  <link rel="icon" type="image/png" href="https://www.piapandora.com/tickletrio/misc/icons8-feather-55.png">
  <style>
    html, body { 
      margin: 0; 
      width: 100%; 
      height: 100%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      background: #008080; 
      transition: background 0.2s ease;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    
    .on { 
      background: #ffffff !important; 
      cursor: none; 
    }
	
	.on.show-cursor {
      cursor: default !important;
    }
	
    button { 
      background-color: #f8f9fa; 
      color: #1a1a1a; 
      border: none; 
      padding: 20px 40px; 
      font-size: 24px; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      cursor: pointer; 
      border-radius: 14px; 
      font-weight: 600; 
      letter-spacing: -0.01em;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25); 
      transform: translateY(0);
      transition: 
        transform 0.15s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.15s cubic-bezier(0.16, 1, 0.3, 1),
        background-color 0.15s ease,
        color 0.15s ease;
      outline: none;
    }

    button:hover { 
      background-color: #ffffff;
      color: #000000;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.38); 
    }

    button:active {
      transform: translateY(1px) scale(0.97);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    button:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.8);
      outline-offset: 4px;
    }

    .hide { 
      display: none !important; 
    }
  </style>
</head>
<body>
  <button id="b" onclick="toggle(true)">Let There Be Light</button>

  <script>
    const b = document.getElementById('b');
    
    function toggle(forceOn) {
      const isCurrentlyOn = document.body.classList.contains('on');
      const turnOn = forceOn !== undefined ? forceOn : !isCurrentlyOn;
      
      document.body.classList.toggle('on', turnOn);
      if (!turnOn) document.body.classList.remove('show-cursor');
      b.classList.toggle('hide', turnOn);
      b.blur();
      
      if (turnOn) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.().catch(() => {});
      }
    }

    window.addEventListener('mousemove', e => {
      if (document.body.classList.contains('on')) {
        document.body.classList.toggle('show-cursor', e.clientY < window.innerHeight * 0.16);
      }
    });

    window.onkeydown = e => {
      if ((e.code === 'Space' || e.code === 'Enter') && document.activeElement !== b) {
        e.preventDefault();
        toggle();
      }
    };
  </script>
</body>
</html>
