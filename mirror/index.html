<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIA MIRROR</title>
<link rel="icon" type="image/png" href="https://piapandora.com/piapandora/micro-logo.png">
<script src="https://piapandora.com/box/vault.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap');
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#000;color:#fafafa;font-family:'Inter',sans-serif;
       background-image:radial-gradient(#1a1a1a 1px,transparent 1px);background-size:40px 40px}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px;display:grid;grid-template-columns:340px 1fr;gap:28px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .brand{font-size:10px;letter-spacing:.5em;font-weight:900;text-transform:uppercase;color:#ff4d4d}
  .fp{font:9px ui-monospace,monospace;color:#52525b;margin-top:4px}
  .lbl{display:block;font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#71717a;margin:18px 0 6px}
  input[type=password],input[type=number],textarea{width:100%;background:#000;border:1px solid #27272a;border-radius:8px;color:#fff;
       padding:9px 10px;font:inherit;font-size:13px;outline:none}
  input:focus,textarea:focus{border-color:#ff4d4d}
  .drop{border:1.5px dashed #27272a;border-radius:12px;min-height:220px;display:flex;align-items:center;justify-content:center;
        text-align:center;cursor:pointer;background:#09090b;color:#71717a;font-size:12px;overflow:hidden;transition:.15s}
  .drop:hover,.drop.over{border-color:#ff4d4d;color:#e4e4e7}
  .drop img{max-width:100%;max-height:320px;display:block}
  .dims{display:flex;align-items:center;gap:8px}
  .dims span{color:#3f3f46;font-weight:700}
  .tiny{background:none;border:0;color:#a1a1aa;font-size:11px;text-decoration:underline;cursor:pointer;padding:6px 0 0}
  .go{margin-top:20px;width:100%;background:#ff4d4d;color:#120000;border:0;border-radius:8px;padding:13px;
      font-size:10px;letter-spacing:.3em;text-transform:uppercase;font-weight:900;cursor:pointer}
  .go:disabled{opacity:.35;cursor:not-allowed}
  .status{font-size:11px;color:#a1a1aa;margin-top:10px;min-height:16px;white-space:pre-wrap}
  .status.err{color:#f87171}
  .stage{display:flex;flex-direction:column;gap:14px}
  .canvas{background:#09090b;border:1px solid #18181b;border-radius:10px;min-height:460px;display:flex;align-items:center;justify-content:center;position:relative}
  .canvas img{max-width:100%;max-height:78vh;display:block;cursor:pointer;border-radius:3px;box-shadow:0 0 100px rgba(255,77,77,.08)}
  .empty{color:#27272a;font-weight:900;font-size:64px;letter-spacing:-.04em;user-select:none}
  .spinner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);
           color:#ff4d4d;font-size:9px;letter-spacing:.6em;font-weight:900;text-transform:uppercase}
  .spinner.on{display:flex}
  .row{display:flex;gap:8px}
  .ghost{background:#09090b;border:1px solid #27272a;color:#d4d4d8;border-radius:8px;padding:8px 12px;font-size:11px;cursor:pointer}
  .ghost:disabled{opacity:.35;cursor:not-allowed}
  .toggle{display:flex;align-items:center;gap:12px;margin-top:18px;cursor:pointer;user-select:none}
  .toggle input{display:none}
  .toggle .track{width:38px;height:22px;border-radius:11px;background:#27272a;position:relative;flex:none;transition:.2s}
  .toggle .knob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#71717a;transition:.2s}
  .toggle input:checked + .track{background:#ff4d4d}
  .toggle input:checked + .track .knob{left:19px;background:#120000}
  .toggle b{display:block;font-size:12px;letter-spacing:.15em;text-transform:uppercase}
  .toggle small{display:block;font-size:11px;color:#71717a}
  .history{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
  .history img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid #27272a;border-radius:4px;opacity:.6;cursor:pointer}
  .history img:hover{opacity:1;border-color:#ff4d4d}
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <div class="brand">Pia Mirror</div>
    <div class="fp" id="fp">ID: ----</div>

    <label class="lbl" for="pass">App Password</label>
    <input type="password" id="pass" placeholder="••••••••" autocomplete="off">

    <label class="lbl">Reference Image</label>
    <div class="drop" id="drop">Drop reference here<br>or click to browse</div>
    <input type="file" id="file" accept="image/*" hidden>

    <label class="lbl">Dimensions (H × W)</label>
    <div class="dims">
      <input type="number" id="h" value="1024">
      <span>×</span>
      <input type="number" id="w" value="768">
    </div>
    <button class="tiny" id="matchRef" type="button">Match reference shape (~1024 max)</button>

    <div id="fyToggles"></div>

    <button class="go" id="go" disabled>Mirror it</button>
    <div class="status" id="status"></div>
  </aside>

  <section class="stage">
    <div class="canvas">
      <div class="empty" id="empty">PIA</div>
      <img id="out" alt="" style="display:none" title="Click to download">
      <div class="spinner" id="spin">Working</div>
    </div>

    <div>
      <label class="lbl" style="margin-top:0" for="prompt">Reverse prompt (edit and re-run if you like)</label>
      <textarea id="prompt" rows="5" placeholder="The description of your reference appears here."></textarea>
      <div class="row" style="margin-top:8px">
        <button class="ghost" id="again" disabled>Generate again (new seed)</button>
        <button class="ghost" id="copy" disabled>Copy prompt</button>
      </div>
    </div>

    <div>
      <label class="lbl" style="margin-top:0">Session</label>
      <div class="history" id="history"></div>
    </div>
  </section>
</div>

<script>
// ---- Maps (paste/update by hand) ----
const GROQ_MAP  = "238,27,102,93,76,178,125,173,173,127,204,169,88,225,16,153,92,231,168,201,183,4,71,43,190,135,90,137,43,157,192,177,202,19,10,116,254,201,161,156,49,159,175,140,146,211,90,100,181,115,157,237,129,18,85,150";
const POLLI_MAP = "21,95,42,194,170,231,117,85,86,250,84,125,131,88,227,190,88,44,123,203,239,50,212,207,210,222,196,238,209,69,253,166,107,53,10";

const VISION_MODEL = "qwen/qwen3.8-27b";
const FLUX_MODEL   = "black-forest-labs/flux.1-schnell";

const REVERSE_INSTRUCTIONS =
  "Generate an exhaustive, highly descriptive reverse-prompt paragraph (160-250 words) designed for advanced AI image generators. " +
  "Systematically describe the visual layout from foreground to background: subject facial features, micro-expressions, garments, " +
  "material textures (e.g. leather grain, metallic sheen), exact color shades, light sources and shadows, depth of field, camera framing, " +
  "and precise rendering medium or art style. Jump straight into the description; omit intros or conversational filler.";

// ---- Characters (edit to taste) ----
const CHARACTERS = {
  pia: {
    name: "Pia", label: "Piafy",
    desc: "a woman in her early-to-mid twenties with copper-red hair (red from roots to ends) worn in two long, loose braids tied with small crimson threads, " +
          "almond-shaped grey-green eyes, a fresh, softly defined adult face, light natural makeup and a calm, gentle expression"
  },
  petra: {
    name: "Petra", label: "Petrafy",
    desc: "a woman in her early-to-mid twenties with long, wavy golden blonde hair (blonde from roots to ends) worn loose and flowing past her shoulders, " +
          "with no braids, ties or updo, clear blue eyes, a fresh, softly defined adult face, light natural makeup and a warm, friendly expression"
  },
  luna: {
    name: "Luna", label: "Lunafy",
    desc: "a woman in her early-to-mid twenties with glossy blue-black hair (blue-black from roots to ends) worn in two neat round buns on top of her head, " +
          "dark grey eyes, a fresh, softly defined adult face, light natural makeup and a calm, quietly curious expression"
  }
};

const FY_INSTRUCTIONS = (c, src) =>
`You rewrite image-generation prompts. Rewrite the prompt below so that its main human subject becomes this character, "${c.name}": ${c.desc}.

Rules:
- Replace the main person's identity (face, hair, age, gender, body type) with ${c.name}. ${c.name} is always an adult woman in her early-to-mid twenties; never describe her as a girl, child or teen, and avoid words like "cute", "little" or "young girl".
- Describe her hairstyle exactly as given above; do not add braids or other hairstyles that are not in her description.
- Keep the original scene, background, composition, pose, lighting, color palette, art style and medium as close as possible.
- Keep the clothing's style and colors, adapting it naturally to a woman if needed. Keep the outfit modest; never make it more revealing than the original.
- Unless the original clearly has a different look, keep her makeup light and natural (no dark or heavy lipstick, no smoky eyes).
- If there are several people, only the most prominent one becomes ${c.name}; leave the others as they are.
- If there is no person in the image (a landscape, object or animal), add ${c.name} naturally into the scene as the main figure, keeping everything else.
- Keep roughly the same length and level of detail.
- Output only the rewritten prompt, with no intro, notes or quotes.

Prompt to rewrite:
${src}`;

const $ = id => document.getElementById(id);
const stripThink = t => t.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();

// Build one toggle per character. All start off; turning one on turns the others off.
for (const [id, c] of Object.entries(CHARACTERS)){
  const l = document.createElement('label');
  l.className = 'toggle';
  l.innerHTML = `<input type="checkbox" class="fy" data-char="${id}">
    <span class="track"><span class="knob"></span></span>
    <span><b>${c.label}</b><small>Turn the subject into ${c.name}</small></span>`;
  $('fyToggles').appendChild(l);
}
document.querySelectorAll('.fy').forEach(cb => cb.addEventListener('change', () => {
  if (cb.checked) document.querySelectorAll('.fy').forEach(o => { if (o !== cb) o.checked = false; });
}));
function activeChar(){
  const on = document.querySelector('.fy:checked');
  return on ? CHARACTERS[on.dataset.char] : null;
}
let refDataUrl = null, refW = 0, refH = 0;

function status(msg, err){ $('status').textContent = msg || ''; $('status').classList.toggle('err', !!err); }
function ready(){ $('go').disabled = !($('pass').value && refDataUrl); }

$('pass').addEventListener('input', () => {
  if (typeof Vault !== 'undefined' && $('pass').value){
    try { $('fp').textContent = 'ID: ' + Vault.fingerprint($('pass').value); } catch(e){ $('fp').textContent = 'ID: ----'; }
  } else $('fp').textContent = 'ID: ----';
  ready();
});

function keyFrom(map){
  if (typeof Vault === 'undefined') throw new Error('vault.js did not load.');
  let k = '';
  try { k = Vault.reconstruct(map, $('pass').value); } catch(e){}
  if (!k) throw new Error('Access denied. Incorrect password.');
  return k;
}

// ---- Reference image: shrink to max 1024 JPEG so the vision call stays small ----
function loadRef(file){
  if (!file || !file.type.startsWith('image/')) return status('Please choose an image file.', true);
  const img = new Image();
  img.onload = () => {
    refW = img.naturalWidth; refH = img.naturalHeight;
    const r = Math.min(1, 1024 / Math.max(refW, refH));
    const c = document.createElement('canvas');
    c.width = Math.round(refW * r); c.height = Math.round(refH * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    refDataUrl = c.toDataURL('image/jpeg', 0.9);
    $('drop').innerHTML = `<img src="${refDataUrl}" alt="Reference">`;
    status(''); ready();
  };
  img.src = URL.createObjectURL(file);
}
$('drop').onclick = () => $('file').click();
$('file').onchange = e => loadRef(e.target.files[0]);
['dragenter','dragover','dragleave','drop'].forEach(t => window.addEventListener(t, e => e.preventDefault()));
$('drop').addEventListener('dragover', () => $('drop').classList.add('over'));
$('drop').addEventListener('dragleave', () => $('drop').classList.remove('over'));
$('drop').addEventListener('drop', e => { $('drop').classList.remove('over'); loadRef(e.dataTransfer.files[0]); });

$('matchRef').onclick = () => {
  if (!refW) return status('Drop a reference first.', true);
  const r = 1024 / Math.max(refW, refH);
  const snap = v => Math.max(256, Math.round(v * r / 64) * 64);
  $('h').value = snap(refH); $('w').value = snap(refW);
};

// ---- Step 1: reverse prompt via Groq vision ----
async function groq(content, maxTokens, label){
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + keyFrom(GROQ_MAP), 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: VISION_MODEL,
      messages: [{ role: 'user', content }],
      temperature: 0.7,
      max_tokens: maxTokens
    })
  });
  if (!res.ok){
    const j = await res.json().catch(() => ({}));
    throw new Error(label + ': ' + (j.error?.message || `HTTP ${res.status}`));
  }
  const j = await res.json();
  const txt = stripThink(j.choices?.[0]?.message?.content || '');
  if (!txt) throw new Error(label + ': empty response.');
  return txt;
}

function reversePrompt(){
  return groq([
    { type: 'text', text: REVERSE_INSTRUCTIONS },
    { type: 'image_url', image_url: { url: refDataUrl } }
  ], 600, 'Vision');
}

function fyPrompt(c, src){
  return groq(FY_INSTRUCTIONS(c, src), 700, c.label);
}

// ---- Step 2: generate with Flux via Pollinations ----
async function generate(prompt){
  const h = parseInt($('h').value) || 1024, w = parseInt($('w').value) || 768;
  const seed = Math.floor(Math.random() * 9000000) + 1000000;
  const url = `https://gen.pollinations.ai/image/${encodeURIComponent(prompt)}?model=${FLUX_MODEL}&seed=${seed}&width=${w}&height=${h}&nologo=true`;
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + keyFrom(POLLI_MAP) } });
  if (!res.ok) throw new Error('Flux: HTTP ' + res.status);
  return URL.createObjectURL(await res.blob());
}

function show(src){
  $('out').src = src; $('out').style.display = 'block'; $('empty').style.display = 'none';
}
function addHistory(src){
  const im = document.createElement('img'); im.src = src; im.onclick = () => show(src);
  $('history').prepend(im);
  while ($('history').children.length > 24) $('history').lastChild.remove();
}
function busy(on){
  $('spin').classList.toggle('on', on);
  $('go').disabled = on || !($('pass').value && refDataUrl);
  $('again').disabled = on || !$('prompt').value.trim();
  $('copy').disabled = !$('prompt').value.trim();
}

async function runFull(){
  try{
    busy(true);
    status('Reading the reference…');
    let p = await reversePrompt();
    const c = activeChar();
    if (c){
      $('prompt').value = p;
      status(`${c.label}ing the prompt…`);
      p = await fyPrompt(c, p);
    }
    $('prompt').value = p;
    status('Painting with Flux…');
    const src = await generate(p);
    show(src); addHistory(src); status('Done. Click the image to download.');
  }catch(e){ status(e.message, true); }
  finally{ busy(false); }
}
async function runAgain(){
  const p = $('prompt').value.trim(); if (!p) return;
  try{
    busy(true); status('Painting with Flux…');
    const src = await generate(p);
    show(src); addHistory(src); status('Done. Click the image to download.');
  }catch(e){ status(e.message, true); }
  finally{ busy(false); }
}

$('go').onclick = runFull;
$('again').onclick = runAgain;
$('prompt').addEventListener('input', () => { $('again').disabled = !$('prompt').value.trim(); $('copy').disabled = $('again').disabled; });
$('copy').onclick = () => navigator.clipboard.writeText($('prompt').value).then(() => {
  $('copy').textContent = 'Copied!'; setTimeout(() => $('copy').textContent = 'Copy prompt', 1500);
}).catch(() => status('Could not copy.', true));

$('out').onclick = () => {
  const a = document.createElement('a'); a.href = $('out').src; a.download = `pia-mirror-${Date.now()}.png`;
  document.body.appendChild(a); a.click(); a.remove();
};

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !$('go').disabled){ e.preventDefault(); runFull(); }
});
</script>
</body>
</html>
