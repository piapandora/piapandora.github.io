<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pattern Studio</title>
  <link rel="icon" type="image/png" href="https://www.piapandora.com/tickletrio/misc/icons8-feather-55.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background: #18181c;
      color: #f4f4f6;
      overflow: hidden;
    }

    /* Sidebar Controls */
    .sidebar {
      width: 380px;
      background: #24242d;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 4px 0 15px rgba(0,0,0,0.4);
      z-index: 10;
      overflow-y: auto;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Pattern Mode Tabs (Rearranged: Tartan - Polka Dots - Stripes) */
    .tab-group {
      display: flex;
      background: #18181c;
      padding: 4px;
      border-radius: 8px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #aaa;
      padding: 8px 0;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #e60067;
      color: #fff;
    }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #888899;
      margin-top: 4px;
    }

    /* Controls Container */
    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-group {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .panel-group.active {
      display: flex;
    }

    .color-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #2e2e3a;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .color-row label {
      font-size: 0.85rem;
      font-weight: 500;
    }

    input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch {
      border: 2px solid #fff;
      border-radius: 50%;
    }

    .controls-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #2e2e3a;
      padding: 10px 12px;
      border-radius: 8px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .controls-group label {
      font-size: 0.8rem;
      color: #ccc;
    }

    .val-badge {
      font-size: 0.8rem;
      font-weight: 600;
      color: #e60067;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #e60067;
      cursor: pointer;
    }

    select {
      background: #18181c;
      color: #fff;
      border: 1px solid #444;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    /* Buttons */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: auto;
      padding-top: 10px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: #e60067;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      width: 100%;
    }

    .btn:hover { background: #ff1a7d; }

    .btn-secondary {
      background: #4a4a5e;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      flex: 1;
      font-size: 0.8rem;
    }

    .btn-secondary:hover { background: #5d5d75; }

    /* Preview Canvas Area */
    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: #121216;
    }

    #previewCanvas {
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border-radius: 6px;
    }

    .badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.65);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h1>Pattern Studio</h1>

    <!-- Mode Selector Tabs (Tartan - Polka Dots - Stripes) -->
    <div class="tab-group">
      <button class="tab-btn active" data-mode="tartan">Tartan</button>
      <button class="tab-btn" data-mode="dots">Polka Dots</button>
      <button class="tab-btn" data-mode="stripes">Stripes</button>
    </div>

    <!-- Global Scale Control -->
    <div class="controls-group">
      <div class="slider-header">
        <label for="scaleSlider">Global Pattern Scale</label>
        <span class="val-badge" id="scaleValue">2.00x</span>
      </div>
      <input type="range" id="scaleSlider" min="0.5" max="8.0" step="0.05" value="2.0">
    </div>

    <!-- Panel 1: TARTAN (Active on Startup) -->
    <div class="panel-group active" id="panel-tartan">
      <div class="section-title">Tartan Palette</div>
      <div class="color-row">
        <label for="colorBase">Base Ground Color</label>
        <input type="color" id="colorBase" value="#d6226e">
      </div>
      <div class="color-row">
        <label for="colorPink">Bright Accent Line</label>
        <input type="color" id="colorPink" value="#f8a3c8">
      </div>
      <div class="color-row">
        <label for="colorDark">Dark Check</label>
        <input type="color" id="colorDark" value="#1a2536">
      </div>
      <div class="color-row">
        <label for="colorCream">Cream Stripe</label>
        <input type="color" id="colorCream" value="#f3eee3">
      </div>
      <div class="color-row">
        <label for="colorYellow">Yellow Pinstripe</label>
        <input type="color" id="colorYellow" value="#dca442">
      </div>

      <div class="btn-row" style="margin-top: 8px;">
        <button class="btn-secondary" id="prevBtn">◄ Prev Clan</button>
        <button class="btn-secondary" id="nextBtn" style="flex:2;">Next Preset (Default)</button>
      </div>
    </div>

    <!-- Panel 2: POLKA DOTS -->
    <div class="panel-group" id="panel-dots">
      <div class="section-title">Dot Colors</div>
      <div class="color-row">
        <label for="dotBg">Background Color</label>
        <input type="color" id="dotBg" value="#1e293b">
      </div>
      <div class="color-row">
        <label for="dotColor1">Primary Dot Color</label>
        <input type="color" id="dotColor1" value="#f43f5e">
      </div>
      <div class="color-row">
        <label for="dotColor2">Alternating Color (Optional)</label>
        <input type="color" id="dotColor2" value="#38bdf8">
      </div>

      <div class="section-title">Geometry & Grid</div>
      <div class="controls-group">
        <label for="dotAlign">Grid Alignment</label>
        <select id="dotAlign">
          <option value="45" selected>45° Diagonal Staggered (Classic)</option>
          <option value="0">0° Straight Grid</option>
        </select>
      </div>

      <div class="controls-group">
        <div class="slider-header">
          <label for="dotSize">Dot Diameter</label>
          <span class="val-badge" id="dotSizeVal">24px</span>
        </div>
        <input type="range" id="dotSize" min="4" max="100" value="24">
      </div>

      <div class="controls-group">
        <div class="slider-header">
          <label for="dotSpacing">Distance Between Dots</label>
          <span class="val-badge" id="dotSpacingVal">36px</span>
        </div>
        <input type="range" id="dotSpacing" min="4" max="120" value="36">
      </div>

      <div class="controls-group">
        <label for="dotAltToggle">Color Style</label>
        <select id="dotAltToggle">
          <option value="single">Single Color</option>
          <option value="alternating">Alternating Dots</option>
        </select>
      </div>
    </div>

    <!-- Panel 3: STRIPES -->
    <div class="panel-group" id="panel-stripes">
      <div class="section-title">Stripe Colors</div>
      <div class="color-row">
        <label for="stripeBg">Background Color</label>
        <input type="color" id="stripeBg" value="#0f172a">
      </div>
      <div class="color-row">
        <label for="stripeColor1">Primary Stripe</label>
        <input type="color" id="stripeColor1" value="#f59e0b">
      </div>
      <div class="color-row">
        <label for="stripeColor2">Secondary Stripe</label>
        <input type="color" id="stripeColor2" value="#10b981">
      </div>
      <div class="color-row">
        <label for="stripeEnable2">Enable Secondary Stripe</label>
        <input type="checkbox" id="stripeEnable2" style="width: 20px; height: 20px; cursor: pointer;">
      </div>

      <div class="section-title">Stripe Dimensions</div>
      <div class="controls-group">
        <div class="slider-header">
          <label for="stripeThick1">Stripe Thickness</label>
          <span class="val-badge" id="stripeThick1Val">20px</span>
        </div>
        <input type="range" id="stripeThick1" min="2" max="120" value="20">
      </div>

      <div class="controls-group">
        <div class="slider-header">
          <label for="stripeGap">Gap Distance</label>
          <span class="val-badge" id="stripeGapVal">20px</span>
        </div>
        <input type="range" id="stripeGap" min="2" max="120" value="20">
      </div>

      <div class="controls-group">
        <div class="slider-header">
          <label for="stripeAngle">Angle / Orientation</label>
          <span class="val-badge" id="stripeAngleVal">45°</span>
        </div>
        <input type="range" id="stripeAngle" min="0" max="180" step="5" value="45">
      </div>

      <div class="btn-row">
        <button class="btn-secondary" onclick="setStripeAngle(0)">0° Horizontal</button>
        <button class="btn-secondary" onclick="setStripeAngle(45)">45° Diagonal</button>
        <button class="btn-secondary" onclick="setStripeAngle(90)">90° Vertical</button>
      </div>
    </div>

    <!-- Actions -->
    <div class="button-group">
      <button class="btn" id="downloadBtn">Download PNG (2048x2048)</button>
    </div>
  </div>

  <!-- Preview Area -->
  <div class="preview-container">
    <div class="badge">Seamless Tiled Preview</div>
    <canvas id="previewCanvas"></canvas>
  </div>

    /* ----------------------------------------------------
       1. POLKA DOT GENERATOR
    ---------------------------------------------------- */
    function createDotTile(scale) {
      const diameter = parseFloat(dotSize.value) * scale;
      const space = parseFloat(dotSpacing.value) * scale;
      const radius = diameter / 2;
      const isDiagonal = dotAlign.value === '45';
      const isAlt = dotAltToggle.value === 'alternating';

      const bg = dotBg.value;
      const c1 = dotColor1.value;
      const c2 = isAlt ? dotColor2.value : c1;

      const tileCanvas = document.createElement('canvas');
      const tileCtx = tileCanvas.getContext('2d');

      if (isDiagonal) {
        const pitch = diameter + space;
        const tileSize = Math.max(4, Math.round(pitch));
        tileCanvas.width = tileSize;
        tileCanvas.height = tileSize;

        tileCtx.fillStyle = bg;
        tileCtx.fillRect(0, 0, tileSize, tileSize);

        const drawCircle = (cx, cy, color) => {
          tileCtx.fillStyle = color;
          tileCtx.beginPath();
          tileCtx.arc(cx, cy, radius, 0, Math.PI * 2);
          tileCtx.fill();
        };

        drawCircle(tileSize / 2, tileSize / 2, c1);
        drawCircle(0, 0, c2);
        drawCircle(tileSize, 0, c2);
        drawCircle(0, tileSize, c2);
        drawCircle(tileSize, tileSize, c2);

      } else {
        const pitch = diameter + space;
        const tileSize = Math.max(4, Math.round(pitch));
        tileCanvas.width = tileSize;
        tileCanvas.height = tileSize;

        tileCtx.fillStyle = bg;
        tileCtx.fillRect(0, 0, tileSize, tileSize);

        tileCtx.fillStyle = c1;
        tileCtx.beginPath();
        tileCtx.arc(tileSize / 2, tileSize / 2, radius, 0, Math.PI * 2);
        tileCtx.fill();
      }

      return tileCanvas;
    }

    /* ----------------------------------------------------
       2. STRIPES GENERATOR (Crash-Safe Vector Projection)
    ---------------------------------------------------- */
    function createStripeTile(scale) {
      const t1 = parseFloat(stripeThick1.value) * scale;
      const gap = parseFloat(stripeGap.value) * scale;
      const angleDeg = parseFloat(stripeAngle.value);

      const bg = stripeBg.value;
      const c1 = stripeColor1.value;
      const c2 = stripeColor2.value;
      const useSecondary = stripeEnable2.checked;

      const colors = useSecondary ? [c1, c2] : [c1];
      const numColors = colors.length;

      // 1. Straight Orientations (0°, 180° Horizontal & 90° Vertical)
      if (angleDeg % 180 === 0 || angleDeg === 90) {
        const period = t1 + gap;
        const tileSize = Math.max(4, Math.round(period * numColors));

        const tileCanvas = document.createElement('canvas');
        tileCanvas.width = tileSize;
        tileCanvas.height = tileSize;
        const tileCtx = tileCanvas.getContext('2d');

        tileCtx.fillStyle = bg;
        tileCtx.fillRect(0, 0, tileSize, tileSize);

        for (let i = 0; i < tileSize; i += period) {
          const colorIdx = Math.floor(i / period) % numColors;
          tileCtx.fillStyle = colors[colorIdx];

          if (angleDeg % 180 === 0) {
            tileCtx.fillRect(0, i, tileSize, t1);
          } else {
            tileCtx.fillRect(i, 0, t1, tileSize);
          }
        }
        return tileCanvas;
      }

      // 2. Vector Projection for Angles (with safeguards)
      const rad = (angleDeg * Math.PI) / 180;
      const rawSin = Math.sin(rad);
      const rawCos = Math.cos(rad);

      // Clamp sinA so denominator never drops below 0.02 (prevents giant canvas allocations)
      const sinA = Math.max(0.02, Math.abs(rawSin));
      const dxPerY = rawCos / (rawSin || 0.02);

      const wEdge = t1 / sinA;
      const pEdge = (t1 + gap) / sinA;

      // Cap max tile dimensions to 2048px to safeguard browser memory
      const rawTileSize = Math.round(pEdge * numColors);
      const tileSize = Math.min(2048, Math.max(8, rawTileSize));

      const tileCanvas = document.createElement('canvas');
      tileCanvas.width = tileSize;
      tileCanvas.height = tileSize;
      const tileCtx = tileCanvas.getContext('2d');

      tileCtx.fillStyle = bg;
      tileCtx.fillRect(0, 0, tileSize, tileSize);

      const startX = -Math.abs(dxPerY * tileSize) - tileSize * 2;
      const endX = tileSize * 3 + Math.abs(dxPerY * tileSize);

      let stripeIndex = 0;
      for (let x = startX; x < endX; x += pEdge) {
        const colorIdx = Math.abs(Math.floor(stripeIndex)) % numColors;
        tileCtx.fillStyle = colors[colorIdx];

        tileCtx.beginPath();
        tileCtx.moveTo(x, 0);
        tileCtx.lineTo(x + wEdge, 0);
        tileCtx.lineTo(x + wEdge + dxPerY * tileSize, tileSize);
        tileCtx.lineTo(x + dxPerY * tileSize, tileSize);
        tileCtx.closePath();
        tileCtx.fill();

        stripeIndex++;
      }

      return tileCanvas;
    }

    /* ----------------------------------------------------
       3. TARTAN GENERATOR
    ---------------------------------------------------- */
    function getSettPattern() {
      return [
        [colorBase.value, 29],
        [colorPink.value, 2],
        [colorBase.value, 4],
        [colorCream.value, 4],
        [colorDark.value, 12],
        [colorYellow.value, 2],
        [colorDark.value, 12],
        [colorCream.value, 4],
        [colorBase.value, 4],
        [colorPink.value, 2],
        [colorBase.value, 29]
      ];
    }

    function createTartanTile(scale) {
      const sett = getSettPattern();
      const threads = [];
      sett.forEach(([col, cnt]) => {
        for (let i = 0; i < cnt; i++) threads.push(col);
      });

      const threadCount = threads.length;
      let rawTileSize = threadCount * scale;
      let tileSize = Math.max(4, Math.round(rawTileSize / 4) * 4);
      let actualScale = tileSize / threadCount;

      const tileCanvas = document.createElement('canvas');
      tileCanvas.width = tileSize;
      tileCanvas.height = tileSize;
      const tileCtx = tileCanvas.getContext('2d');

      for (let y = 0; y < threadCount; y++) {
        const yStart = Math.floor(y * actualScale);
        const yEnd = Math.floor((y + 1) * actualScale);
        const weftColor = threads[y];

        for (let x = 0; x < threadCount; x++) {
          const xStart = Math.floor(x * actualScale);
          const xEnd = Math.floor((x + 1) * actualScale);
          const warpColor = threads[x];

          const isWarpTop = ((x + y) % 4) < 2;
          tileCtx.fillStyle = isWarpTop ? warpColor : weftColor;
          tileCtx.fillRect(xStart, yStart, xEnd - xStart, yEnd - yStart);
        }
      }

      return tileCanvas;
    }

    /* ----------------------------------------------------
       MAIN RENDER LOOP
    ---------------------------------------------------- */
    function draw() {
      const scale = parseFloat(scaleSlider.value);
      scaleValue.textContent = scale.toFixed(2) + 'x';

      document.getElementById('dotSizeVal').textContent = dotSize.value + 'px';
      document.getElementById('dotSpacingVal').textContent = dotSpacing.value + 'px';
      document.getElementById('stripeThick1Val').textContent = stripeThick1.value + 'px';
      document.getElementById('stripeGapVal').textContent = stripeGap.value + 'px';
      document.getElementById('stripeAngleVal').textContent = stripeAngle.value + '°';

      let tile;
      if (currentMode === 'dots') tile = createDotTile(scale);
      else if (currentMode === 'stripes') tile = createStripeTile(scale);
      else tile = createTartanTile(scale);

      const pattern = ctx.createPattern(tile, 'repeat');
      ctx.fillStyle = pattern;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function resizeCanvas() {
      const size = Math.min(window.innerWidth - 380 - 80, window.innerHeight - 80);
      canvas.width = Math.max(300, size);
      canvas.height = Math.max(300, size);
      draw();
    }

    // Tartan Presets
    function updatePalette(index) {
      currentPaletteIndex = index;
      const active = currentPaletteIndex === -1 ? defaultPalette : clanPalettes[currentPaletteIndex];

      colorBase.value = active[0];
      colorPink.value = active[1];
      colorDark.value = active[2];
      colorCream.value = active[3];
      colorYellow.value = active[4];

      nextBtn.textContent = currentPaletteIndex === -1 ? "Next Preset (Default)" : `Preset ${currentPaletteIndex + 1}/${clanPalettes.length}`;
      draw();
    }

    nextBtn.addEventListener('click', () => {
      let nextIdx = currentPaletteIndex + 1;
      if (nextIdx >= clanPalettes.length) nextIdx = -1;
      updatePalette(nextIdx);
    });

    prevBtn.addEventListener('click', () => {
      let prevIdx = currentPaletteIndex - 1;
      if (prevIdx < -1) prevIdx = clanPalettes.length - 1;
      updatePalette(prevIdx);
    });

    // Event Listeners for Live Preview updates
    document.querySelectorAll('input, select').forEach(elem => {
      elem.addEventListener('input', draw);
      elem.addEventListener('change', draw);
    });

    window.addEventListener('resize', resizeCanvas);

    // High-Res Export (2048x2048 PNG)
    downloadBtn.addEventListener('click', () => {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 2048;
      exportCanvas.height = 2048;
      const exportCtx = exportCanvas.getContext('2d');

      const scale = parseFloat(scaleSlider.value);
      let tile;
      if (currentMode === 'dots') tile = createDotTile(scale);
      else if (currentMode === 'stripes') tile = createStripeTile(scale);
      else tile = createTartanTile(scale);

      const pattern = exportCtx.createPattern(tile, 'repeat');
      exportCtx.fillStyle = pattern;
      exportCtx.fillRect(0, 0, 2048, 2048);

      const link = document.createElement('a');
      link.download = `${currentMode}-pattern-2048.png`;
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    });

    // Initial Run
    resizeCanvas();
  </script>
</body>
</html>
