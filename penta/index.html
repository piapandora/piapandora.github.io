<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penta Spin</title>
<link rel="icon" type="image/png" href="https://www.piapandora.com/tickletrio/misc/icons8-feather-55.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&family=Inter:wght@600&display=swap">
<style>
:root{
  --bg:#fafafa; --card:#ffffff; --fg:#09090b; --muted:#71717a; --border:#e4e4e7;
  --pop:#facc15; --pop-fg:#09090b; --pop-hover:#eab308;
  --w:clamp(56px,16vw,120px); --h:calc(var(--w)*1.3);
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:Inter,ui-sans-serif,system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#09090b;--card:#0c0c0f;--fg:#fafafa;--muted:#a1a1aa;--border:#27272a}
}
:root[data-theme="dark"]{--bg:#09090b;--card:#0c0c0f;--fg:#fafafa;--muted:#a1a1aa;--border:#27272a}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;cursor:default;background:var(--bg);color:var(--fg);display:grid;place-items:center;font-family:var(--sans)}
main{display:flex;flex-direction:column;align-items:center;gap:clamp(20px,4vh,32px);padding:16px;width:100%}
.reels{display:flex;gap:clamp(6px,1.4vw,12px);max-width:100%}
.win{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:var(--card);
  border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.05);
  transition:border-color .2s}
.win::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,var(--card),transparent 16%,transparent 84%,var(--card))}
.win.hit{border-color:var(--pop)}
.strip{will-change:transform}
.cell{height:var(--h);display:grid;place-items:center;font-family:var(--mono);font-weight:800;
  font-size:calc(var(--w)*.8);line-height:1;color:var(--fg)}
.strip.go .cell{filter:blur(1.2px)}
#spin{
  font:600 clamp(18px,4.5vw,22px)/1 var(--sans);color:var(--pop-fg);
  width:min(100%,calc(var(--w)*5 + clamp(6px,1.4vw,12px)*4));height:64px;
  border:0;border-radius:10px;cursor:pointer;background:var(--pop);
  box-shadow:0 1px 2px rgba(0,0,0,.1);
  transition:background .15s,transform .08s;
}
#spin:hover:not(:disabled){background:var(--pop-hover)}
#spin:active:not(:disabled){transform:scale(.985)}
#spin:disabled{cursor:progress;opacity:.55}
#spin:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main>
  <div class="reels" id="reels"></div>
  <button id="spin" type="button">Spin</button>
  <div class="sr" id="out" aria-live="polite"></div>
</main>
<script>
(function(){
  var LET="ABCDEFGHIJKLMNOPQRSTUVWXYZ", DIG="0123456789", COUNT=5;
  var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var btn=document.getElementById("spin"), out=document.getElementById("out");
  var box=document.getElementById("reels"), reels=[], busy=false, ctx=null;

  // 50% digit, 50% capital letter; each is then uniform within its group
  // Unbiased secure integer in [0, n) using rejection sampling
  function int(n){
    var a=new Uint32Array(1), lim=Math.floor(4294967296/n)*n;
    do{crypto.getRandomValues(a)}while(a[0]>=lim);
    return a[0]%n;
  }
  // Real results come from the secure generator
  function pick(){return int(2)===0?DIG[int(10)]:LET[int(26)]}
  // Filler characters that blur past during the spin are cosmetic only
  function rand(){return Math.random()<0.5?DIG[Math.floor(Math.random()*10)]:LET[Math.floor(Math.random()*26)]}
  function cell(c){var s=document.createElement("div");s.className="cell"+(c<="9"?" d":"");s.textContent=c;return s}
  function fill(strip,chars){strip.textContent="";chars.forEach(function(c){strip.appendChild(cell(c))})}

  for(var i=0;i<COUNT;i++){
    var win=document.createElement("div");win.className="win";
    var strip=document.createElement("div");strip.className="strip";
    var c=pick();fill(strip,[c]);
    win.appendChild(strip);box.appendChild(win);
    reels.push({win:win,strip:strip,cur:c});
  }

  // C major pentatonic, degrees 1 2 3 5 6 (C D E G A), one note per reel
  var NOTES=[261.63,293.66,329.63,392,440];
  function thunk(i){
    try{
      if(!ctx)return;
      var o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;
      o.type="triangle";o.frequency.value=NOTES[i];
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.35);
      o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.36);
    }catch(e){}
  }

  // Soft two-note chime when the button becomes active again
  function ping(){
    try{
      if(!ctx)return;
      [523.25,1046.5].forEach(function(f,k){
        var o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;
        o.type="sine";o.frequency.value=f;
        g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14/(1+k*2),t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.5);
        o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.52);
      });
    }catch(e){}
  }
  // Every reel lands with the exact same animation. Reels differ only in how
  // many fast pre-roll loops they run first, which staggers when they stop.
  var P=10, CELL_MS=20, EASE="cubic-bezier(.12,.7,.15,1)";
  function spin(){
    if(busy)return;busy=true;btn.disabled=true;btn.textContent="Spinning";out.textContent="";
    try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume()}catch(e){}
    var done=0;
    reels.forEach(function(r,i){
      var final=pick(), L=reduce?3:14, m=reduce?0:1+i*2, ldur=reduce?250+i*120:1500;
      var h=r.win.clientHeight, roll=null;
      r.win.classList.remove("hit");r.strip.classList.add("go");

      function land(){
        var g=[r.cur];
        for(var k=1;k<L;k++)g.push(rand());
        g.push(final);
        fill(r.strip,g);
        var a=r.strip.animate(
          [{transform:"translateY(0)"},{transform:"translateY("+(-L*h)+"px)"}],
          {duration:ldur,easing:EASE,fill:"forwards"});
        a.onfinish=function(){
          r.cur=final;fill(r.strip,[final]);a.cancel();
          r.strip.classList.remove("go");r.win.classList.add("hit");
          thunk(i);
          if(++done===COUNT){
            setTimeout(function(){busy=false;btn.disabled=false;btn.textContent="Spin";ping();btn.focus({preventScroll:true})},400);
            out.textContent="Result: "+reels.map(function(x){return x.cur}).join(" ");
            btn.focus({preventScroll:true});
          }
        };
      }

      if(m>0){
        // periodic strip: the same P cells twice, so each loop looks identical
        var base=[r.cur];
        for(var j=1;j<P;j++)base.push(rand());
        fill(r.strip,base.concat(base));
        roll=r.strip.animate(
          [{transform:"translateY(0)"},{transform:"translateY("+(-P*h)+"px)"}],
          {duration:P*CELL_MS,iterations:m,easing:"linear"});
        roll.onfinish=function(){roll.cancel();land()};
      }else land();
    });
  }
  btn.addEventListener("click",spin);
})();
</script>
</body>
</html>
