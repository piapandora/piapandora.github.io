<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Command</title>
  <link rel="icon" type="image/png" href="https://piapandora.com/box/misc/green-icon.png">
  <style>
    :root {
      --green: #00ff66;
      --dark-green: #003311;
      --bg: #050b07;
    }

    body {
      background-color: var(--bg);
      color: var(--green);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
    }

    h1 {
      margin: 0 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 8px var(--green);
    }

    #hud {
      display: flex;
      justify-content: space-between;
      width: 400px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    #radar-container {
      position: relative;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      border: 2px solid var(--green);
      background: radial-gradient(circle, var(--dark-green) 0%, var(--bg) 70%);
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
      cursor: crosshair;
      overflow: hidden;
    }

    /* Radar Grid Rings */
    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 1px dashed rgba(0, 255, 102, 0.3);
      border-radius: 50%;
      pointer-events: none;
    }
    .ring-1 { width: 100px; height: 100px; }
    .ring-2 { width: 200px; height: 200px; }
    .ring-3 { width: 300px; height: 300px; }

    /* Crosshairs */
    .axis-h, .axis-v {
      position: absolute;
      background: rgba(0, 255, 102, 0.2);
      pointer-events: none;
    }
    .axis-h { top: 50%; left: 0; width: 100%; height: 1px; }
    .axis-v { left: 50%; top: 0; width: 1px; height: 100%; }

    /* Sweeper Arm */
    #sweeper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 200px;
      height: 200px;
      background: conic-gradient(from 0deg at 0% 0%, rgba(0, 255, 102, 0.4) 0deg, transparent 60deg);
      transform-origin: 0% 0%;
      pointer-events: none;
      border-radius: 0 0 100% 0;
    }

    /* Ping Ripple */
    .ping {
      position: absolute;
      width: 10px;
      height: 10px;
      border: 2px solid var(--green);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: ping-anim 1s ease-out forwards;
      pointer-events: none;
    }

    @keyframes ping-anim {
      0% { width: 4px; height: 4px; opacity: 1; }
      100% { width: 60px; height: 60px; opacity: 0; }
    }

    /* Visual Feedback Elements */
    .target-reveal {
      position: absolute;
      width: 16px;
      height: 16px;
      background: #ff0055;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px #ff0055;
      pointer-events: none;
    }

    #message {
      margin-top: 15px;
      height: 24px;
      font-size: 1.1rem;
      text-align: center;
    }

    button {
      margin-top: 10px;
      background: transparent;
      color: var(--green);
      border: 1px solid var(--green);
      padding: 8px 16px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      visibility: hidden; /* Preserves layout space when hidden */
    }

    button:hover {
      background: var(--green);
      color: var(--bg);
    }
  </style>
</head>
<body>

  <h1>Radar Command</h1>
  
  <div id="hud">
    <div id="ammo">AMMO: 7 / 7</div>
    <div id="status">STATUS: SEARCHING</div>
  </div>

  <div id="radar-container">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="axis-h"></div>
    <div class="axis-v"></div>
    <div id="sweeper"></div>
  </div>

  <div id="message">Click inside the radar grid to fire sonar pings.</div>
  <button id="reset-btn" onclick="initGame()">RESTART MISSION</button>

  <script>
    const radar = document.getElementById('radar-container');
    const sweeper = document.getElementById('sweeper');
    const ammoEl = document.getElementById('ammo');
    const statusEl = document.getElementById('status');
    const msgEl = document.getElementById('message');
    const resetBtn = document.getElementById('reset-btn');

    const RADIUS = 200; // Radar radius in px
    const HIT_THRESHOLD = 36; // Distance in px required for a direct hit
    const MAX_AMMO = 7;

    let target = { x: 0, y: 0 };
    let ammo = MAX_AMMO;
    let gameOver = false;
    let sweepAngle = 0;

    // Audio Synthesis Setup
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'ping') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } else if (type === 'miss') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    // Animate radar sweep arm
    function animateSweep() {
      sweepAngle = (sweepAngle + 1.5) % 360;
      sweeper.style.transform = `rotate(${sweepAngle}deg)`;
      requestAnimationFrame(animateSweep);
    }
    animateSweep();

    // Spawn target randomly inside the circle
    function spawnTarget() {
      const angle = Math.random() * Math.PI * 2;
      const distance = Math.random() * (RADIUS - 40) + 20; 
      
      target.x = RADIUS + distance * Math.cos(angle);
      target.y = RADIUS + distance * Math.sin(angle);
    }

    function initGame() {
      ammo = MAX_AMMO;
      gameOver = false;
      ammoEl.textContent = `AMMO: ${ammo} / ${MAX_AMMO}`;
      statusEl.textContent = 'STATUS: SEARCHING';
      msgEl.textContent = 'Click inside the radar grid to fire sonar pings.';
      resetBtn.style.visibility = 'hidden';

      // Clear existing ping overlays / targets
      document.querySelectorAll('.ping, .target-reveal').forEach(el => el.remove());
      
      spawnTarget();
    }

    // Handle Shots
    radar.addEventListener('click', (e) => {
      if (gameOver) return;

      const rect = radar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      // Spawn visual ripple ping
      const ping = document.createElement('div');
      ping.className = 'ping';
      ping.style.left = `${clickX}px`;
      ping.style.top = `${clickY}px`;
      radar.appendChild(ping);
      setTimeout(() => ping.remove(), 1000);

      // Distance calculation to target
      const dist = Math.hypot(clickX - target.x, clickY - target.y);
      ammo--;
      ammoEl.textContent = `AMMO: ${ammo} / ${MAX_AMMO}`;

      if (dist <= HIT_THRESHOLD) {
        // Direct Hit
        playSound('hit');
        statusEl.textContent = 'STATUS: TARGET DESTROYED';
        msgEl.textContent = 'DIRECT HIT! Excellent shooting, Commander.';
        endGame(true);
      } else {
        // Miss - calculate proximity feedback
        playSound('ping');
        let proximityFeedback = '';
        if (dist < 60) proximityFeedback = 'HOT! Extremely close!';
        else if (dist < 120) proximityFeedback = 'WARM... Ping returned medium delay.';
        else proximityFeedback = 'COLD... Signal weak.';

        if (ammo > 0) {
          msgEl.textContent = `MISSED! ${proximityFeedback}`;
        } else {
          // Out of ammo: lock inputs, update text, wait 1.5 seconds before revealing target
          gameOver = true; 
          msgEl.textContent = `MISSED! ${proximityFeedback}`;
          
          setTimeout(() => {
            playSound('miss');
            statusEl.textContent = 'STATUS: MISSION FAILED';
            msgEl.textContent = `OUT OF AMMO! Target escaped.`;
            endGame(false);
          }, 1500);
        }
      }
    });

    function endGame(isWin) {
      gameOver = true;
      resetBtn.style.visibility = 'visible';

      // Reveal the target position on game over
      const targetMarker = document.createElement('div');
      targetMarker.className = 'target-reveal';
      targetMarker.style.left = `${target.x}px`;
      targetMarker.style.top = `${target.y}px`;
      if (!isWin) targetMarker.style.background = '#ff0000';
      radar.appendChild(targetMarker);
    }

    // Start game on load
    initGame();
  </script>
</body>
</html>
