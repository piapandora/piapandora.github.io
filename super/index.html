<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Super Image Extractor Deck</title>
  <link rel="icon" type="image/png" href="https://www.piapandora.com/tickletrio/misc/icons8-feather-55.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Paste Input Overlay */
    #paste-overlay {
      position: fixed;
      inset: 0;
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      touch-action: auto;
      padding: 20px;
    }
    .paste-box {
      background: #141414;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 650px;
      height: 80vh;
      max-height: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid #222;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85);
    }
    .paste-box textarea {
      width: 100%;
      flex: 1;
      background: #080808;
      border: 1px solid #333;
      border-radius: 8px;
      color: #2ecc71;
      padding: 16px;
      outline: none;
      font-size: 13px;
      font-family: monospace;
      resize: none;
      user-select: text;
      -webkit-user-select: text;
      touch-action: auto;
    }
    .paste-box textarea:focus {
      border-color: #2ecc71;
    }
    .paste-box button {
      padding: 15px;
      background: #2ecc71;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 14px;
      letter-spacing: 1.5px;
      transition: background 0.2s;
    }
    .paste-box button:hover {
      background: #27ae60;
    }
    #error-msg {
      color: #ff5555;
      font-size: 12px;
      font-family: monospace;
      min-height: 16px;
      text-align: center;
    }

    /* Floating Action / Back Button */
    #reset-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 900;
      background: rgba(20, 20, 20, 0.7);
      border: 1px solid rgba(46, 204, 113, 0.5);
      color: #2ecc71;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      transition: all 0.2s ease;
    }
    #reset-btn:hover {
      background: rgba(46, 204, 113, 0.2);
    }

    /* Toast Notification */
    #toast-msg {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid #2ecc71;
      color: #2ecc71;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      pointer-events: none;
      z-index: 999;
      opacity: 0;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Deck Container */
    #deck-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: none;
      justify-content: center;
      align-items: center;
    }
    #slides-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      will-change: transform;
    }
    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }
    .img-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .caption-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 30px 20px 25px;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      color: #ffffff;
      text-align: center;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: opacity 0.2s ease;
    }
    .caption-overlay:empty {
      display: none;
    }
    .caption-title {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #2ecc71;
    }
    .caption-text {
      font-size: 0.9rem;
      opacity: 0.85;
      font-weight: 400;
    }
  </style>
</head>
<body>

  <!-- Toast Notification -->
  <div id="toast-msg"></div>

  <!-- Re-paste Control Button -->
  <button id="reset-btn" onclick="showPasteOverlay()">PASTE SOURCE</button>

  <!-- Paste Source Overlay -->
  <div id="paste-overlay">
    <div class="paste-box">
      <textarea id="source-input" placeholder="Paste website source code, HTML, CSS, or raw text here..." spellcheck="false" autofocus></textarea>
      <div id="error-msg"></div>
      <button onclick="processAndLoadDeck()">LOAD IMAGE DECK</button>
    </div>
  </div>

  <!-- Vertical Image Deck -->
  <div id="deck-container">
    <div id="slides-track">
      <div class="slide" id="slide-prev">
        <div class="img-wrapper">
          <img id="img-prev" src="" alt="" />
          <div class="caption-overlay" id="cap-prev"></div>
        </div>
      </div>
      <div class="slide" id="slide-curr">
        <div class="img-wrapper">
          <img id="img-curr" src="" alt="" />
          <div class="caption-overlay" id="cap-curr"></div>
        </div>
      </div>
      <div class="slide" id="slide-next">
        <div class="img-wrapper">
          <img id="img-next" src="" alt="" />
          <div class="caption-overlay" id="cap-next"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Active Deck State
    let deckItems = [];
    let currentIndex = 0;
    let windowHeight = window.innerHeight;
    let imageCache = {};

    let startY = 0;
    let currentY = 0;
    let deltaY = 0;
    let isDragging = false;
    let isAnimating = false;

    let lastY = 0;
    let lastTime = 0;
    let velocityY = 0;
    let lastTapTime = 0;

    // DOM Elements
    const track = document.getElementById('slides-track');
    const slidePrev = document.getElementById('slide-prev');
    const slideCurr = document.getElementById('slide-curr');
    const slideNext = document.getElementById('slide-next');

    const imgPrev = document.getElementById('img-prev');
    const imgCurr = document.getElementById('img-curr');
    const imgNext = document.getElementById('img-next');

    const capPrev = document.getElementById('cap-prev');
    const capCurr = document.getElementById('cap-curr');
    const capNext = document.getElementById('cap-next');

    // Regex for Image Extraction
    const IMAGE_EXT_REGEX = /\.(png|jpe?g|gif|svg|webp|avif|bmp|ico|tiff?|heic)(?:[?#].*)?$/i;

    function showToast(message) {
      const toast = document.getElementById('toast-msg');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2200);
    }

    function showPasteOverlay() {
      document.getElementById('paste-overlay').style.display = 'flex';
      document.getElementById('reset-btn').style.display = 'none';
      document.getElementById('deck-container').style.display = 'none';
    }

    // URL Extraction Logic
    function extractImageURLs(text) {
      if (!text || !text.trim()) return [];

      const seen = new Set();
      const list = [];

      function addUrl(rawUrl) {
        if (!rawUrl) return;
        let cleaned = rawUrl.trim().replace(/[.,;:]+$/, '');
        
        if (cleaned.startsWith('//')) {
          cleaned = 'https:' + cleaned;
        }

        if (IMAGE_EXT_REGEX.test(cleaned) && !seen.has(cleaned)) {
          seen.add(cleaned);
          list.push({ url: cleaned, title: '', caption: '' });
        }
      }

      // 1. Extract HTML attribute values
      const attrRegex = /(?:href|src|action|content|data-src|data-url|poster)\s*=\s*["']([^"']+)["']/gi;
      let match;
      while ((match = attrRegex.exec(text)) !== null) {
        addUrl(match[1]);
      }

      // 2. Extract standard full URLs
      const urlRegex = /\b(?:https?:\/\/|www\.)[^\s<>"'{}|\\^`\[\]]+/gi;
      while ((match = urlRegex.exec(text)) !== null) {
        addUrl(match[0]);
      }

      // 3. Extract Protocol-relative URLs
      const protoRelativeRegex = /(?:\s|^|["'])\/\/[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(?:\/[^\s<>"'{}|\\^`\[\]]*)?/gi;
      while ((match = protoRelativeRegex.exec(text)) !== null) {
        const cleanedProto = match[0].trim().replace(/^["']/, '');
        addUrl(cleanedProto);
      }

      return list;
    }

    function processAndLoadDeck() {
      const sourceText = document.getElementById('source-input').value;
      const errEl = document.getElementById('error-msg');

      if (!sourceText.trim()) {
        errEl.innerText = "PLEASE PASTE SOURCE CODE FIRST";
        return;
      }

      const extracted = extractImageURLs(sourceText);

      if (!extracted.length) {
        errEl.innerText = "NO VALID IMAGE URLS FOUND IN SOURCE CODE";
        return;
      }

      errEl.innerText = "";
      deckItems = extracted;
      currentIndex = 0;

      // Switch display to Image Deck
      document.getElementById('paste-overlay').style.display = 'none';
      document.getElementById('deck-container').style.display = 'flex';
      document.getElementById('reset-btn').style.display = 'block';

      updateImages();
      showToast(`✓ LOADED DECK (${deckItems.length} IMAGES)`);
    }

    // Memory Window Management
    function syncMemoryWindow() {
      if (!deckItems.length) return;

      const keepIndices = new Set();
      const offsets = [-2, -1, 0, 1, 2];

      offsets.forEach(offset => {
        keepIndices.add(getWrappedIndex(currentIndex + offset));
      });

      keepIndices.forEach(idx => {
        const url = deckItems[idx].url;
        if (url && !imageCache[url]) {
          const img = new Image();
          img.src = url;
          imageCache[url] = img;
        }
      });

      Object.keys(imageCache).forEach(cachedUrl => {
        const isNeeded = Array.from(keepIndices).some(idx => deckItems[idx].url === cachedUrl);
        if (!isNeeded) {
          imageCache[cachedUrl].src = '';
          delete imageCache[cachedUrl];
        }
      });
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function getWrappedIndex(idx) {
      const len = deckItems.length;
      if (len === 0) return 0;
      return ((idx % len) + len) % len;
    }

    function renderCaption(el, item) {
      if (!item || (!item.title && !item.caption)) {
        el.innerHTML = '';
        return;
      }
      let html = '';
      if (item.title) html += `<div class="caption-title">${item.title}</div>`;
      if (item.caption) html += `<div class="caption-text">${item.caption}</div>`;
      el.innerHTML = html;
    }

    function updateImages() {
      if (!deckItems.length) return;

      const prevIndex = getWrappedIndex(currentIndex - 1);
      const currIndex = getWrappedIndex(currentIndex);
      const nextIndex = getWrappedIndex(currentIndex + 1);

      const itemPrev = deckItems[prevIndex];
      const itemCurr = deckItems[currIndex];
      const itemNext = deckItems[nextIndex];

      imgPrev.src = itemPrev ? itemPrev.url : '';
      imgCurr.src = itemCurr ? itemCurr.url : '';
      imgNext.src = itemNext ? itemNext.url : '';

      renderCaption(capPrev, itemPrev);
      renderCaption(capCurr, itemCurr);
      renderCaption(capNext, itemNext);

      slidePrev.style.transform = `translate3d(0, ${-windowHeight}px, 0)`;
      slideCurr.style.transform = `translate3d(0, 0, 0)`;
      slideNext.style.transform = `translate3d(0, ${windowHeight}px, 0)`;

      syncMemoryWindow();
    }

    // Gesture & Touch Mechanics
    function onTouchStart(e) {
      if (isAnimating) return;

      const currentTime = performance.now();
      const tapLength = currentTime - lastTapTime;

      if (tapLength < 300 && tapLength > 0) {
        toggleFullscreen();
        lastTapTime = 0;
      } else {
        lastTapTime = currentTime;
      }

      isDragging = true;
      const touch = e.touches ? e.touches[0] : e;
      startY = touch.clientY;
      currentY = startY;
      lastY = startY;
      lastTime = performance.now();
      velocityY = 0;

      track.style.transition = 'none';
    }

    function onTouchMove(e) {
      if (!isDragging) return;

      const touch = e.touches ? e.touches[0] : e;
      currentY = touch.clientY;
      deltaY = currentY - startY;

      if (Math.abs(deltaY) > 10) {
        lastTapTime = 0;
      }

      const now = performance.now();
      const dt = now - lastTime;
      if (dt > 0) {
        const dy = currentY - lastY;
        velocityY = (dy / dt) * 1000;
        lastY = currentY;
        lastTime = now;
      }

      track.style.transform = `translate3d(0, ${deltaY}px, 0)`;
    }

    function onTouchEnd() {
      if (!isDragging) return;
      isDragging = false;

      const swipeDistanceThreshold = windowHeight * 0.22;
      const velocityThreshold = 450;
      let targetIndexDelta = 0;

      if (deltaY < -swipeDistanceThreshold || velocityY < -velocityThreshold) {
        targetIndexDelta = 1;
      } else if (deltaY > swipeDistanceThreshold || velocityY > velocityThreshold) {
        targetIndexDelta = -1;
      }

      snapToSlide(targetIndexDelta);
    }

    function snapToSlide(indexDelta) {
      isAnimating = true;

      const targetY = -indexDelta * windowHeight;
      const duration = 0.38;

      track.style.transition = `transform ${duration}s cubic-bezier(0.25, 1, 0.5, 1)`;
      track.style.transform = `translate3d(0, ${targetY}px, 0)`;

      setTimeout(() => {
        currentIndex = getWrappedIndex(currentIndex + indexDelta);
        track.style.transition = 'none';
        track.style.transform = `translate3d(0, 0, 0)`;
        updateImages();
        isAnimating = false;
        deltaY = 0;
      }, duration * 1000);
    }

    let wheelTimeout = null;
    let accumulatedWheel = 0;

    function onWheel(e) {
      e.preventDefault();
      if (isAnimating) return;

      accumulatedWheel += e.deltaY;
      clearTimeout(wheelTimeout);
      wheelTimeout = setTimeout(() => { accumulatedWheel = 0; }, 200);

      if (Math.abs(accumulatedWheel) > 50) {
        const delta = accumulatedWheel > 0 ? 1 : -1;
        accumulatedWheel = 0;
        snapToSlide(delta);
      }
    }

    function onResize() {
      windowHeight = window.innerHeight;
      updateImages();
    }

    // Global Listeners
    window.addEventListener('resize', onResize);
    window.addEventListener('wheel', onWheel, { passive: false });

    const container = document.getElementById('deck-container');
    container.addEventListener('touchstart', onTouchStart, { passive: true });
    container.addEventListener('touchmove', onTouchMove, { passive: true });
    container.addEventListener('touchend', onTouchEnd);

    container.addEventListener('mousedown', onTouchStart);
    container.addEventListener('dblclick', toggleFullscreen);
    window.addEventListener('mousemove', onTouchMove);
    window.addEventListener('mouseup', onTouchEnd);
  </script>
</body>
</html>
